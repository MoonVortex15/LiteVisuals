
name: Build LiteVisuals

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: gradle build

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: LiteVisuals-jar
          path: build/libs/*.jar
